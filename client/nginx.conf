server {
    listen 80;
    server_name unistart.kz www.unistart.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://unistart.kz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.unistart.kz;

    ssl_certificate     /etc/letsencrypt/live/unistart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unistart.kz/privkey.pem;

    return 301 https://unistart.kz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name unistart.kz;

    ssl_certificate     /etc/letsencrypt/live/unistart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unistart.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /health {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /robots.txt {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s; 
        client_max_body_size 1024M; 
    }

    location /hubs/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    location /hangfire {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /og {
        internal;
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        if ($http_user_agent ~* "Twitterbot|facebookexternalhit|LinkedInBot|Slackbot|TelegramBot|Discordbot|WhatsApp|vkShare|Viber|Pinterest") {
            rewrite ^ /og last;
        }

        try_files $uri $uri/ /index.html;
    }

    # Branded social short links resolved by the backend (302 → UTM URLs).
    location ~ ^/(threads|instagram|tiktok|telegram)$ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~* ^/(favicon|icon-|apple-touch-icon|og-image) {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

