# ═══════════════════════════════════════════════════════
#  UniStart nginx — HTTPS reverse-proxy + SPA
# ═══════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ──────────────────────────────
server {
    listen 80;
    server_name unistart.kz www.unistart.kz;

    # Let's Encrypt challenge (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health-check (Docker / load balancer)
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS (canonical non-www)
    location / {
        return 301 https://unistart.kz$request_uri;
    }
}

# ── www → non-www canonical redirect ──────────────────
server {
    listen 443 ssl http2;
    server_name www.unistart.kz;

    ssl_certificate     /etc/letsencrypt/live/unistart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unistart.kz/privkey.pem;

    return 301 https://unistart.kz$request_uri;
}

# ── Main HTTPS server ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name unistart.kz;

    # ── SSL certificates (Let's Encrypt) ────────────────
    ssl_certificate     /etc/letsencrypt/live/unistart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unistart.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # ── Health-check (proxy to API) ─────────────────────
    location /health {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Dynamic SEO: robots.txt & sitemap.xml via API ──
    location = /robots.txt {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy API requests to the backend ───────────────
    location /api/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # OCR + LLM pipeline can take minutes        client_max_body_size 512M; # large PDF textbook uploads    }

    # ── Proxy SignalR / WebSocket hubs ──────────────────
    location /hubs/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── Proxy Hangfire dashboard ────────────────────────
    location /hangfire {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── OG endpoint for social media bots ──
    location = /og {
        internal;
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (React Router) — route social media bots to /og ──
    location / {
        if ($http_user_agent ~* "Twitterbot|facebookexternalhit|LinkedInBot|Slackbot|TelegramBot|Discordbot|WhatsApp|vkShare|Viber|Pinterest") {
            rewrite ^ /og last;
        }

        try_files $uri $uri/ /index.html;
    }

    # ── Favicon / OG images — short cache for updates ──
    location ~* ^/(favicon|icon-|apple-touch-icon|og-image) {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Static asset caching ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── White Label school subdomains ──────────────────────
# Matches *.unistart.kz (e.g. linhao.unistart.kz)
# Serves the same SPA; frontend detects subdomain and fetches branding
server {
    listen 443 ssl http2;
    server_name ~^(?<school>.+)\.unistart\.kz$;

    ssl_certificate     /etc/letsencrypt/live/unistart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unistart.kz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # ── Dynamic SEO: robots.txt & sitemap.xml via API ──
    location = /robots.txt {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API proxy
    location /api/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        client_max_body_size 512M; # large PDF textbook uploads
    }

    # SignalR
    location /hubs/ {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Health
    location /health {
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── OG endpoint for social media bots ──
    location = /og {
        internal;
        proxy_pass         http://api:5009;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — route social media bots to /og for dynamic OG tags
    location / {
        if ($http_user_agent ~* "Twitterbot|facebookexternalhit|LinkedInBot|Slackbot|TelegramBot|Discordbot|WhatsApp|vkShare|Viber|Pinterest") {
            rewrite ^ /og last;
        }

        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
