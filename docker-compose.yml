# ═══════════════════════════════════════════════════════
#  UniStart — Docker Compose (API + PostgreSQL + Client)
# ═══════════════════════════════════════════════════════
#  Usage:
#    cp .env.example .env   # fill in secrets
#    docker compose up -d --build
#
#  Services:
#    postgres  — PostgreSQL 17 on port 5432
#    api       — .NET 8 backend on port 5009
#    client    — nginx + React SPA on port 80
# ═══════════════════════════════════════════════════════

services:
  # ────────────────────────────────────────────────────
  #  PostgreSQL 17
  # ────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-UniStart}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"  # uncomment for local dev DB access
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-UniStart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────
  #  .NET 8 API
  # ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      UNISTART_DB_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-UniStart};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JwtSettings__Issuer: ${JWT_ISSUER:-UniStart}
      JwtSettings__Audience: ${JWT_AUDIENCE:-UniStartUsers}
      JwtSettings__ExpirationMinutes: ${JWT_EXPIRATION:-1440}
      EmailSettings__SmtpHost: ${SMTP_HOST:-smtp.gmail.com}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__UseSsl: ${SMTP_USE_SSL:-true}
      EmailSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      EmailSettings__SenderName: ${SMTP_SENDER_NAME:-UniStart}
      EmailSettings__Username: ${SMTP_USERNAME:-}
      EmailSettings__Password: ${SMTP_PASSWORD:-}
      EmailSettings__Enabled: ${SMTP_ENABLED:-false}
      LlmExtraction__Provider: ${LLM_PROVIDER:-deepseek}
      LlmExtraction__ApiKey: ${LLM_API_KEY:-}
      LlmExtraction__Model: ${LLM_MODEL:-deepseek-chat}
      LlmExtraction__BaseUrl: ${LLM_BASE_URL:-https://api.deepseek.com}
      CorsOrigins__0: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "${API_PORT:-5009}:5009"

  # ────────────────────────────────────────────────────
  #  React Client (nginx reverse-proxy + SPA)
  # ────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-80}:80"

volumes:
  pgdata:
