# ═══════════════════════════════════════════════════════
#  UniStart CI — Build, Test, Lint
# ═══════════════════════════════════════════════════════
#  Triggers: push/PR to main, develop
#  Jobs:
#    1. backend  — dotnet restore → build → test
#    2. frontend — npm ci → tsc → build
# ═══════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────
  #  .NET 8 Backend
  # ────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UniStart

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore UniStart.sln

      - name: Build
        run: dotnet build UniStart.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test UniStart.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: UniStart/UniStart.Tests/TestResults/*.trx

  # ────────────────────────────────────────────────────
  #  React 19 Frontend
  # ────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UniStart/client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UniStart/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

  # ────────────────────────────────────────────────────
  #  Docker Build (validate only, no push)
  # ────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t unistart-api:ci -f UniStart/Dockerfile UniStart/

      - name: Build Client image
        run: docker build -t unistart-client:ci -f UniStart/client/Dockerfile UniStart/client/
