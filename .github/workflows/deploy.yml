# ═══════════════════════════════════════════════════════
#  UniStart CD — Deploy to Production
# ═══════════════════════════════════════════════════════
#  Trigger: manual (workflow_dispatch) or after CI passes on main
#  Strategy: SSH into VPS, pull latest, docker compose up
# ═══════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            chown -R root:root /opt/unistart/.git
            cd /opt/unistart
            git config --global --add safe.directory /opt/unistart
            git pull origin master
            docker compose down
            docker compose up -d --build
            docker compose exec -T api dotnet ef database update --no-build || true
            echo "Deploy completed at $(date)"
            echo "Waiting for API to be ready..."
            sleep 15
            curl -f --retry 5 --retry-delay 5 --retry-all-errors https://unistart.kz/health/ready || exit 1
            echo "API is healthy! Deploy successful."
